name: Bybit debug

on:
  workflow_dispatch:

jobs:
  debug:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Debug egress of the proxy
        env:
          BYBIT_PROXY_URL: ${{ secrets.BYBIT_PROXY_URL }}
          BYBIT_PROXY_SECRET: ${{ secrets.BYBIT_PROXY_SECRET }}
        run: |
          curl -sS --max-time 30 -H "X-Proxy-Secret: ${BYBIT_PROXY_SECRET}" "${BYBIT_PROXY_URL%/}/debug-egress"
          echo
